name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push always carries all the data, so it may replace an older run.
# This also frees the queue if a deploy hangs (seen 2026-10-06: deploy stuck
# in "waiting" for a day and blocked every later run).
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build twice
        run: |
          python src/make_site.py --out _site
          python src/make_site.py --out _site_check
      - name: Builds are byte-identical
        run: diff -r _site _site_check
      - name: Links, size, no scripts
        run: python src/check_site.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
